<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>KapeRazzo Coffee House — Admin Panel</title>

  <link rel="stylesheet" href="../STYLES/admin_style.css"/>

  <!-- Simple admin check (replace later with Firebase) -->
  <script>
    const role = sessionStorage.getItem("role");
    if (role !== "admin") {
      window.location.href = "login.html";
    }
  </script>
</head>

<body>
  <header class="admin-header">
    <div class="header-inner">
      <img class="admin-logo" src="../PICTURES/KapeRazzo_logo.jpg" alt="KapeRazzo Logo">
      <div>
        <h1>KapeRazzo Admin Panel</h1>
        <p class="tagline">Manage Orders & Reservations</p>
      </div>
      <button id="logoutBtn" class="logout-btn">Logout</button>
    </div>
  </header>

  <main class="container">
    <section>
      <h2 class="section-title">Admin Dashboard</h2>
      <p class="muted">
        Orders and reservations are fetched directly from <strong>MongoDB</strong>.
      </p>

      <div class="admin-actions">
        <button class="btn" id="refreshBtn">Refresh Data</button>
        <button class="btn" id="exportBtn">Export JSON</button>
      </div>

      <div id="adminMsg"></div>

      <!-- ORDERS -->
      <h3 class="admin-subtitle">🧾 Orders</h3>
      <div id="ordersWrap"></div>

      <!-- RESERVATIONS -->
      <h3 class="admin-subtitle">📅 Reservations</h3>
      <div id="reservationsWrap"></div>
    </section>
  </main>

  <footer class="admin-footer">
    <p>© 2025 KapeRazzo Coffee House | Admin Dashboard</p>
  </footer>

  <script src="../JS/admin.js"></script>
  <script>
    document.getElementById("logoutBtn").addEventListener("click", () => {
      sessionStorage.clear();
      window.location.href = "login.html";
    });
  </script>
</body>
</html>
