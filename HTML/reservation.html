<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>KapeRazzo Coffee House — Reservation</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Custom Styles -->
  <link rel="stylesheet" href="../STYLES/styles.css"/>
</head>
<body>
  <header class="site-header fixed-top bg-dark text-light border-top border-3 border-dark">
    <nav class="navbar navbar-dark navbar-expand-lg">
      <div class="container-fluid">
        <a class="navbar-brand d-flex align-items-center text-decoration-none" href="index.html">
          <img class="logo me-3" src="../PICTURES/KapeRazzo_logo.jpg" alt="Company Logo">
          <div class="d-none d-sm-block lh-sm">
              <span class="h5 text-light my-0">KapeRazzo Coffee House</span><br/>
              <span class="tagline text-light my-0">Warm cups. Cozy vibes.</span>
          </div>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
          <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
            <li class="nav-item tfx-hover-lift-low">
              <a href="../index.html" class="nav-link text-white ms-4">Home</a>
            </li>
            <li class="nav-item tfx-hover-lift-low">
              <a href="menu.html" class="nav-link text-white ms-4">Menu</a>
            </li>
            <li class="nav-item tfx-hover-lift-low">
              <a href="order.html" class="nav-link text-white ms-4">Order</a>
            </li>
            <li class="nav-item tfx-hover-lift-low">
              <a href="#" class="nav-link text-white ms-4">Reserve</a>
            </li>
            <li class="nav-item tfx-hover-lift-low">
              <a href="gallery.html" class="nav-link text-white ms-4">Gallery</a>
            </li>
            <li class="nav-item tfx-hover-lift-low">
              <a href="about.html" class="nav-link text-white ms-4">About</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>
  </header>

  <main class="container pt-3">
    <h2 class="section-title mb-4">Reserve a Table</h2>

    <div class="card shadow-sm">
      <div class="card-body">
        <form id="resForm">
          <div class="mb-3">
            <label for="rname" class="form-label">Full Name *</label>
            <input id="rname" class="form-control" placeholder="Enter your full name"/>
          </div>

          <div class="row mb-3">
            <div class="col-md-6 mb-3 mb-md-0">
              <label for="rdate" class="form-label">Date *</label>
              <input id="rdate" type="date" class="form-control"/>
            </div>
            <div class="col-md-6">
              <label for="rtime" class="form-label">Time Slot *</label>
              <select id="rtime" class="form-select">
                <option value="">Select...</option>
                <option>08:00</option>
                <option>10:00</option>
                <option>12:00</option>
                <option>14:00</option>
                <option>16:00</option>
                <option>18:00</option>
              </select>
            </div>
          </div>

          <div class="mb-3">
            <label for="party" class="form-label">Party Size *</label>
            <select id="party" class="form-select">
              <option>1</option><option>2</option><option>3</option>
              <option>4</option><option>5</option><option>6</option>
            </select>
          </div>

          <div class="mb-3">
            <label for="requests" class="form-label">Special Requests</label>
            <input id="requests" class="form-control" placeholder="Near window, birthday, etc." />
          </div>

          <div id="resMsg" class="message-area mb-3 text-success" aria-live="polite"></div>

          <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Reserve</button>
            <button type="reset" class="btn btn-secondary">Reset</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="container d-flex justify-content-between align-items-center flex-wrap">
      <div class="footer-left">
        <strong>KapeRazzo Coffee House</strong>
        <p class="muted">📍 11 GENERAL TIRONA ST. BRGY 138 BAGONG BARRIO • Mon–Sun 7:00 AM – 9:00 PM</p>
      </div>
      <div class="footer-right">
        <nav class="small-nav">
          <a href="https://instagram.com" target="_blank"><img class="IG-Logo" src="../PICTURES/HERO/IG_Logo.png" alt="Instagram"></a>
          <a href="https://www.facebook.com/kaperazzoPH" target="_blank"><img class="FB-Logo" src="../PICTURES/HERO/FB_Logo.png" alt="Facebook"></a>
        </nav>
        <p class="muted">Built for a school project • No payments processed</p>
      </div>
    </div>
  </footer>

  <!-- Bootstrap JS + Popper -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- External JS -->
  <script src="../JS/reservation.js"></script>
</body>
</html>
